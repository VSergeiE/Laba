<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>База данных</title>
    <link rel="icon" href="pictures/Logo-roundMin.ico">
<!-- DOMPurify (для очистки HTML) -->
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
   <style>
        /* базовые стили для красоты */
        body{
    margin-left: 10%;
    margin-right: 10%;
    background-color: #2C3E50;
            }
        h1 { color: #fff; }
        .article {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .article h2 { margin-top: 0; }
        .article img, .article video {
            max-width: 100%;
            border-radius: 6px;
            margin: 10px 0;
        }
        .article small {
            color: #777;
            display: block;
            margin-top: 10px;
        }
        .loader {
            text-align: center;
            font-size: 18px;
            color: #555;
        }
        .error {
            color: red;
            font-weight: bold;
        }
        /* форма для добавления статьи (опционально) */
        .add-form {
            background: #eef;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .add-form input, .add-form textarea, .add-form select {
            display: block;
            width: 100%;
            margin: 8px 0;
            padding: 8px;
            box-sizing: border-box;
        }
        .add-form button {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
        .end{
            width: 50px;
            height: 50px;
            background: #28a745;
            border-radius: 50%;
              display: flex;
    justify-content: center; /* выравнивание по горизонтали */
    align-items: center;
        }
        img{
            width: 30px;
            height: 30px;
        }
        .divbutton{
               display: flex;
    justify-content: space-between;
    align-items: center;
        }
    </style>
</head>
<body>

    <h1>📝 Добавление статьи</h1>
    <!-- ---- Опционально: форма для добавления новой статьи ---- -->
    <div class="add-form">
        <h3>➕ Добавить статью</h3>
        <input type="text" id="title" placeholder="Заголовок">
        <div id="editor-container" style="height: 600px; background: white; border-radius: 6px;"></div>
        <select id="topic">
                <option value="Bpla">Пилотирование</option>
                <option value="Robot">Программирование</option>
                <option value="Electron">Электроника</option>
        </select>
        <input type="text" id="image_url" placeholder="URL фоновая картинка">
        <input type="text" id="video_url" placeholder="URL видео (необязательно)">
        <div class="divbutton">
            <button id="add-btn">Добавить</button>
            <div class="end">
                <a href="AdminAdd.html">
                    <img src="/pictures/back.png" alt="назад" >
                </a>
            </div>
        </div>
        <div id="add-message"></div>
    </div>
    
    <!-- Подключаем JavaScript -->
    <script src="https://cdn.tiny.cloud/1/nguajpaywln4je7awrb1ozru5vjc35iptcj3bw2ab3ofr7hz/tinymce/6/tinymce.min.js" referrerpolicy="origin"></script>
<script>
    // Инициализация TinyMCE
    tinymce.init({
        selector: '#editor-container',
        height: 600,
        plugins: 'lists link image code',
        toolbar: 'undo redo | formatselect | bold italic underline | alignleft aligncenter alignright | bullist numlist | link image | code',
        license_key: 'gpl'
    });

    // ---- Добавление новой статьи ----
    const addBtn = document.getElementById('add-btn');
    if (addBtn) {
        addBtn.addEventListener('click', function() {
            const title = document.getElementById('title').value.trim();
            
            // Получаем HTML из TinyMCE
            const rawContent = tinymce.get('editor-container').getContent();
            const cleanContent = DOMPurify.sanitize(rawContent);
            
            // Получаем чистый текст для проверки
            const textContent = tinymce.get('editor-container').getContent({ format: 'text' }).trim();
            const msg = document.getElementById('add-message');

            if (!textContent) {
                msg.textContent = 'Текст статьи не может быть пустым!';
                msg.style.color = 'red';
                return;
            }
            const image_url = document.getElementById('image_url').value.trim();  
            const video_url = document.getElementById('video_url').value.trim();
            const topic = document.getElementById('topic').value;

            if (!title || !textContent || !topic) {
                msg.textContent = 'Заполните заголовок, текст и тему!';
                msg.style.color = 'red';
                return;
            }

            const newArticle = { title, content: cleanContent, image_url, video_url, topic };

            fetch('/api/articles', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newArticle)
            })
            .then(res => {
                if (!res.ok) throw new Error('Ошибка при добавлении');
                return res.json();
            })
            .then(data => {
                msg.textContent = '✅ Статья добавлена!';
                msg.style.color = 'green';
                // Очищаем поля
                document.getElementById('title').value = '';
                document.getElementById('image_url').value='';
                document.getElementById('video_url').value = '';
                document.getElementById('topic').selectedIndex = 0;
                tinymce.get('editor-container').setContent(''); // Очищаем TinyMCE
            })
            .catch(err => {
                msg.textContent = '❌ ' + err.message;
                msg.style.color = 'red';
            });
        });
    }
</script>
</body>
</html>
